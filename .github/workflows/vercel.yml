name: Vercel

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/futtracker/**"
      - ".github/workflows/vercel.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/futtracker/**"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Gate. `deploy` declara `needs: verify`, y eso lo enforcea Actions: no
  # depende de branch protection ni de permisos de admin sobre el repo.
  verify:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend/futtracker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/futtracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # El script corre `next typegen` antes de `tsc`. Sin eso falla en un
      # checkout limpio: `next-env.d.ts` y los helpers globales de rutas
      # (LayoutProps, PageProps, RouteContext) son generados y gitignoreados.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Todavia no hay test runner. `--if-present` devuelve 0 mientras no
      # exista el script, y empieza a gatear solo cuando lo agreguen.
      - name: Tests
        run: npm run test --if-present

  deploy:
    name: Build & Deploy (Vercel CLI)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # La app no vive en la raiz del repo. No hay workspace npm en la raiz, asi
    # que el directorio de la app es el root del proyecto Vercel: todos los
    # comandos corren desde aca y el Root Directory del dashboard queda en ".".
    defaults:
      run:
        working-directory: frontend/futtracker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 pide Node >= 20.9. 22 es el runtime default de Vercel.
          node-version: "22"
          cache: npm
          # El lockfile no esta en la raiz: sin esto el cache no resuelve.
          cache-dependency-path: frontend/futtracker/package-lock.json

      - name: Resolve deployment target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # pull -> build -> deploy. El orden importa: `pull` baja las env vars al
      # runner y `build` las inlinea. Invertirlo da un build verde y roto.
      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes \
            --environment=${{ steps.target.outputs.environment }} \
            --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} \
            --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview: ${process.env.DEPLOY_URL}`,
            });
