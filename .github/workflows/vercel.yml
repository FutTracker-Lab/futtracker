name: Vercel

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/futtracker/**"
      # Un cambio solo en /supabase antes no disparaba nada: ni CI ni deploy.
      # Ahora que la carpeta tiene migraciones vivas, eso deja sin chequear
      # justo los cambios de schema. El costo es un redeploy de mas cuando el
      # cambio es solo de base; barato al lado de mergear a ciegas.
      - "supabase/**"
      - ".github/workflows/vercel.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/futtracker/**"
      - "supabase/**"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate. La cadena `verify` -> `migrations` -> `deploy` la enforcea Actions via
  # `needs`: no depende de branch protection ni de permisos de admin sobre el repo.
  #
  # Es lo unico que corre en un PR: ningun secret de Vercel entra a este job,
  # asi que el check pasa igual aunque quien abre el PR no tenga acceso a los
  # secrets del repo (caso tipico: PR desde un fork).
  verify:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend/futtracker

    # Valores de descarte. `next.config.ts` importa lib/env/public.ts, asi que
    # `next typegen` valida las variables antes de tipar. Este job no produce
    # ningun artefacto desplegable: solo tipa, lintea y testea, y para eso no
    # necesita apuntar a un Supabase real.
    #
    # La validacion que importa corre en el job de deploy, donde `vercel build`
    # usa las variables reales que bajo `vercel pull`. Si ahi falta alguna, el
    # deploy falla despues del merge y no publica nada: la rama queda mergeada
    # pero el sitio publicado sigue siendo el anterior.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://ci-placeholder.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/futtracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # El script corre `next typegen` antes de `tsc`. Sin eso falla en un
      # checkout limpio: `next-env.d.ts` y los helpers globales de rutas
      # (LayoutProps, PageProps, RouteContext) son generados y gitignoreados.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Vitest. Sin `--if-present`: con ese flag, borrar o renombrar el script
      # `test` dejaba el paso en verde con cero tests corridos, que es
      # exactamente lo que un gate no tiene que hacer. Los e2e de Playwright
      # que pide T17 todavia faltan.
      - name: Tests
        run: npm run test

  # Las migraciones van antes del deploy, nunca despues: Vercel y Supabase son
  # caminos separados y sin este `needs` corren en paralelo, con la chance de
  # publicar codigo nuevo contra el schema viejo.
  migrations:
    name: Supabase migrations
    needs: verify
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/supabase-deploy.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    secrets: inherit

  deploy:
    name: Build & Deploy (Vercel CLI)
    needs: migrations
    # En un PR no se deploya: solo corre el chequeo. El build y el deploy pasan
    # una vez que el merge aterriza en dev o en main, que son las unicas ramas
    # que disparan `push` aca arriba.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # La app no vive en la raiz del repo. No hay workspace npm en la raiz, asi
    # que el directorio de la app es el root del proyecto Vercel: todos los
    # comandos corren desde aca y el Root Directory del dashboard queda en ".".
    defaults:
      run:
        working-directory: frontend/futtracker

    # El token es un secret del repo, no de quien mergea: el deploy se atribuye
    # siempre a la cuenta de Vercel que emitio el token, sea quien sea el actor.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 pide Node >= 20.9. 22 es el runtime default de Vercel.
          node-version: "22"
          cache: npm
          # El lockfile no esta en la raiz: sin esto el cache no resuelve.
          cache-dependency-path: frontend/futtracker/package-lock.json

      # main -> production. dev y `workflow_dispatch` -> preview.
      - name: Resolve deployment target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # pull -> build -> deploy. El orden importa: `pull` baja las env vars al
      # runner y `build` las inlinea. Invertirlo da un build verde y roto.
      - name: Pull Vercel project settings
        run: |
          vercel pull --yes \
            --environment=${{ steps.target.outputs.environment }} \
            --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        run: vercel build ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} \
            --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      # La allowlist de Supabase tiene esta URL fija, no la de cada deploy.
      - name: Alias dev deployment
        if: github.ref == 'refs/heads/dev'
        run: |
          if ! vercel alias set "${{ steps.deploy.outputs.url }}" \
            futtracker-dev.vercel.app --token="$VERCEL_TOKEN"; then
            {
              echo "### Fallo el alias, no el deploy"
              echo ""
              echo "El deploy publico bien: ${{ steps.deploy.outputs.url }}"
              echo ""
              echo "futtracker-dev.vercel.app sigue apuntando al deploy anterior;"
              echo "usa el link de arriba mientras tanto. Para arreglarlo, volve a"
              echo "correr el workflow desde Actions. Si vuelve a fallar, revisa en"
              echo "Vercel que el dominio siga asignado a este proyecto."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi
