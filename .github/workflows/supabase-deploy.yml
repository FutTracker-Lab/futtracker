name: Supabase Deploy


on:
  push:
    branches: [main, dev]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente destino'
        required: true
        type: choice
        options: [dev, prod]


concurrency:
  group: supabase-deploy-${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    # Una corrida normal no pasa de un par de minutos. Sin esto, un `db push`
    # colgado se come el default de Actions, que son 6 horas.
    timeout-minutes: 15
    env:
      TARGET_ENV: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    # `supabase/` cuelga de la raiz del repo, no de frontend/futtracker.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Validar ambiente y credenciales
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Faltan credenciales para el ambiente '$TARGET_ENV':$missing"
            exit 1
          fi
          echo "Ambiente: $TARGET_ENV / project ref: $PROJECT_REF"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link al proyecto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Estado de migraciones (antes)
        run: supabase migration list --linked

      - name: Dry run
        run: supabase db push --linked --dry-run

      - name: Aplicar migraciones
        run: supabase db push --linked --yes

      - name: Estado de migraciones (después)
        run: supabase migration list --linked