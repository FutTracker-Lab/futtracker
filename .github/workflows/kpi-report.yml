name: Reporte diario de KPIs

# T22 (FUT-132). Mide FutTracker y manda los 10 KPIs a la plataforma de LAB4.
# Alta de secretos y de la cuenta del reporter: docs/kpis.md.
#
# El cron de GitHub está en UTC y solo corre desde la rama por defecto (main):
# 06:00 UTC son las 03:00 en Buenos Aires (R3.1). Puede llegar con demora,
# y no importa: la plataforma cuenta el día de recepción.
#
# El ambiente es a la vez lo que se mide (nuestra base y nuestro deploy) y el
# `env` al que se reporta: los secretos de `dev` solo miden dev y solo
# reportan a dev. El cron va a `prod`; mientras los profesores no emitan la
# clave de prod, la variable de repo KPI_SCHEDULE_ENV=dev lo apunta a dev.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente que se mide y al que se reporta
        type: choice
        options: [dev, prod]
        default: dev
      command:
        description: report manda las mediciones; catalog da de alta los KPIs
        type: choice
        options: [report, catalog]
        default: report
      date:
        description: "Día a reportar, YYYY-MM-DD (vacío: el día anterior en Buenos Aires)"
        type: string
        required: false

permissions:
  contents: read

# Dos corridas del mismo ambiente en paralelo medirían una la latencia de la
# otra. No se cancela la que está corriendo: un envío a medias es peor.
concurrency:
  group: kpi-report-${{ inputs.environment || vars.KPI_SCHEDULE_ENV || 'prod' }}
  cancel-in-progress: false

jobs:
  report:
    name: ${{ inputs.command || 'report' }} (${{ inputs.environment || vars.KPI_SCHEDULE_ENV || 'prod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || vars.KPI_SCHEDULE_ENV || 'prod' }}
    defaults:
      run:
        working-directory: frontend/futtracker

    steps:
      - uses: actions/checkout@v4

      # Node 22.18 o más: el script es TypeScript y Node lo corre sin compilar.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/futtracker/package-lock.json

      - run: npm ci

      # Los inputs viajan por variables de entorno y no interpolados en el
      # comando, para que ningún valor se ejecute como shell.
      - name: KPIs
        run: node scripts/kpis/kpis.mts "$KPI_COMMAND"
        env:
          KPI_COMMAND: ${{ inputs.command || 'report' }}
          KPI_ENV: ${{ inputs.environment || vars.KPI_SCHEDULE_ENV || 'prod' }}
          KPI_DATE: ${{ inputs.date }}
          # La plataforma de la cátedra. Tiene un proyecto de Supabase por
          # ambiente, con su propia URL y su propia clave pública: van las tres
          # en el ambiente, nunca a nivel repo.
          KPI_API_URL: ${{ vars.KPI_API_URL }}
          KPI_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KPI_SUPABASE_PUBLISHABLE_KEY }}
          KPI_PROJECT_KEY: ${{ secrets.KPI_PROJECT_KEY }}
          # Lo nuestro, del ambiente elegido.
          NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          KPI_APP_URL: ${{ vars.KPI_APP_URL }}
          KPI_REPORTER_EMAIL: ${{ secrets.KPI_REPORTER_EMAIL }}
          KPI_REPORTER_PASSWORD: ${{ secrets.KPI_REPORTER_PASSWORD }}
